# DB secret newline stripped at runtime
name: 07-daily_data外盘日线(东财COBOT5)
on:
  schedule:
    - cron: '36 10 * * *'   # 北京时间 18:36 每日（错开 18:30/32/34 三个任务）
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary curl_cffi

      - name: Run daily_data incremental update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOOKBACK_DAYS: '7'
          TZ: Asia/Shanghai
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python "外盘期货日线数据库/src/update_daily_data.py"

      - name: Verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python - <<'PY'
          import os, psycopg2
          with psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=15) as c:
              with c.cursor() as cur:
                  cur.execute("select count(*), count(distinct contract_code), max(trade_date), count(*) filter(where close is null) from public.daily_data")
                  total, ncode, dmax, null_close = cur.fetchone()
          print(f"daily_data: total={total} contracts={ncode} max_date={dmax} null_close={null_close}")
          assert ncode == 5 and null_close == 0, "验收失败"
          PY
