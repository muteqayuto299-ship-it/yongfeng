name: 98-一次性加生成列(daily_data 自动计算字段)

# 一次性 DDL：给 public.daily_data 追加三个 STORED 生成列
#   pct_chg      涨跌幅 %   = (close-pre_close)/pre_close*100
#   amplitude    振幅 %     = (high-low)/pre_close*100
#   notional_usd 名义成交额 = vol*合约乘数*close/100
# 不动任何已有数据；幂等，可重复执行。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Apply generated columns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python "外盘期货日线数据库/src/migrate_generated_cols.py"
