name: 99-一次性修正daily_data(20261125)

# 一次性任务：修复 2026-11-25 由 v1 脚本(Yahoo 主源)写入的两类脏数据
#   1) 删除 2026-11-25 未收盘残 bar（5 行）
#   2) 2026-11-18~11-24（25 行）回滚为东财原始值
# 修完即可保留本文件作审计记录（仅 workflow_dispatch 手动触发，不会定时跑）
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run repair
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python "外盘期货日线数据库/src/repair_20261125.py"

      - name: Verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python - <<'PY'
          import os, psycopg2
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          url = os.environ["DATABASE_URL"]
          lim = (datetime.now(ZoneInfo("America/Chicago")) - timedelta(hours=13, minutes=20)).date()
          with psycopg2.connect(url, connect_timeout=20) as c, c.cursor() as cur:
              cur.execute("""select count(*), count(distinct contract_code),
                                    min(trade_date), max(trade_date)
                             from public.daily_data""")
              total, ncode, dmin, dmax = cur.fetchone()
              cur.execute("select vol from public.daily_data where contract_code='103.ZS00Y' and trade_date='2026-11-24'")
              zs = cur.fetchone()[0]
              cur.execute("""select count(*) from (
                               select contract_code, trade_date, vol,
                                      lag(vol) over (partition by contract_code order by trade_date) pv
                                 from public.daily_data) t
                              where pv is not null and vol = pv""")
              ndup = cur.fetchone()[0]
          print(f"daily_data: total={total} contracts={ncode} {dmin}~{dmax} ZS1124_vol={zs} dup_vol={ndup} last_final={lim}")
          assert total == 1130, f"总行数应为 1130，实际 {total}"
          assert ncode == 5, "品种数应为 5"
          assert max(d for d in [dmax]) <= lim, f"存在未收盘交易日 {dmax} > {lim}"
          assert zs == 132460, f"大豆 11-24 量应为 132460，实际 {zs}"
          assert ndup == 0, f"相邻日成交量重复 {ndup} 处"
          print("VERIFY PASS")
          PY
