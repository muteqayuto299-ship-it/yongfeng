name: 99-DB连接测试(一次性只读)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install psycopg2-binary
      - name: Test DB connection (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PYX'
          import os, psycopg2
          url = os.environ.get("DATABASE_URL")
          if not url:
              print("FAIL: DATABASE_URL secret is empty"); raise SystemExit(1)
          try:
              conn = psycopg2.connect(url, connect_timeout=20)
              cur = conn.cursor()
              cur.execute("SELECT 1")
              print("DB CONNECT OK:", cur.fetchone()[0])
              cur.execute("SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
              print("PUBLIC TABLES:", cur.fetchone()[0])
              cur.close(); conn.close()
              print("=== DATABASE SECRET VALID ===")
          except Exception as e:
              print("DB CONNECT FAIL:", type(e).__name__, str(e)[:200]); raise SystemExit(1)
          PYX
