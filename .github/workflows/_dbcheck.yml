name: 99-DB连接测试(一次性只读)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install psycopg2-binary
      - name: Test DB connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PYX'
          import os, psycopg2
          from urllib.parse import urlparse, urlunparse
          url = os.environ.get("DATABASE_URL","")
          print("URL length:", len(url))
          print("URL tail (masked):", repr(url[-40:]).replace(url.split('@')[0].split('//')[-1],'***'))
          p = urlparse(url)
          print("path repr:", repr(p.path), "| query repr:", repr(p.query))
          clean = url.strip()
          print("after strip, path repr:", repr(urlparse(clean).path))
          try:
              conn = psycopg2.connect(clean, connect_timeout=20)
              cur = conn.cursor(); cur.execute("SELECT 1")
              print("DB CONNECT OK (after strip):", cur.fetchone()[0])
              cur.execute("SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
              print("PUBLIC TABLES:", cur.fetchone()[0])
              cur.close(); conn.close()
              print("=== DATABASE SECRET VALID ===")
          except Exception as e:
              print("DB CONNECT FAIL FULL:", str(e)); raise SystemExit(1)
          PYX
