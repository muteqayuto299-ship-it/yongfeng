# cron-redundant-20261125 202611251353
# schedule-refresh-20261124 202611241315
# DB secret newline stripped at runtime
name: 02-外盘期货日线(TradingView)
on:
  schedule:
    - cron: '0 0 * * *'   # 冗余点1 UTC00:00 (漂移后约北京08:00-10:00)
    - cron: '0 6 * * *'   # 冗余点2 UTC06:00 (约北京14:00-16:00)
    - cron: '0 12 * * *'  # 冗余点3 UTC12:00 (约北京20:00-22:00)
    - cron: '0 18 * * *'  # 冗余点4 UTC18:00 (约北京02:00-04:00)
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python -m pip install --upgrade pip
          pip install websocket-client psycopg2-binary pandas

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Shanghai

        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python "外盘期货日线数据库/src/update_daily_tv.py"
