# cron-redundant-20261125
# schedule-refresh-20261124 202611241315
# DB secret newline stripped at runtime
name: 03-套保公告(巨潮)
on:
  schedule:
    - cron: '0 0 * * *'   # 冗余点1 UTC00:00
    - cron: '0 6 * * *'   # 冗余点2 UTC06:00
    - cron: '0 12 * * *'  # 冗余点3 UTC12:00
    - cron: '0 18 * * *'  # 冗余点4 UTC18:00
  workflow_dispatch:   # 允许在 Actions 页面手动触发
    inputs:
      start_date:
        description: '回补开始日期 YYYY-MM-DD（留空则沿用脚本默认=昨天）'
        required: false
        default: ''
      end_date:
        description: '回补结束日期 YYYY-MM-DD（留空则沿用脚本默认=今天）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python -m pip install --upgrade pip
          pip install -r 套期保值hedging_announcements/requirements.txt

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Shanghai

        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          SCRIPT="套期保值hedging_announcements/src/04_incremental_update_postgres.py"
          if [ -n "$START" ] && [ -n "$END" ]; then
            echo "[backfill] start=$START end=$END"
            python "$SCRIPT" "$START" "$END"
          elif [ -n "$START" ]; then
            echo "[backfill] start=$START end=(today)"
            python "$SCRIPT" "$START"
          else
            echo "[daily] default range"
            python "$SCRIPT"
          fi
