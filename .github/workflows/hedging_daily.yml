# __DB_CLEAN__ patched
name: 03-套保公告(巨潮)
on:
  schedule:
    - cron: '34 10 * * *'   # 北京时间 18:34 每日
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 套期保值hedging_announcements/requirements.txt

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Shanghai

        run: |
          python "套期保值hedging_announcements/src/04_incremental_update_postgres.py"
