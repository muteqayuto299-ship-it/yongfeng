name: 04-新闻编排(akshare+RSS，X默认关闭)
on:
  schedule:
    - cron: '10 15 * * *'   # 北京时间 23:10 每日
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r news_articles/requirements.txt

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Shanghai
          ENABLE_TWITTER: '0'
        run: |
          python news_articles/src/run_daily_news.py
