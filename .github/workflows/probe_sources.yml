# DB secret newline stripped at runtime
name: 00-探测数据源可达性(手动)
on:
  schedule:
    - cron: '0 0 1 1 *'   # 北京时间 一次性探测，建议手动触发
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python -m pip install --upgrade pip
          pip install requests akshare feedparser websocket-client

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Shanghai

        run: |
          export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          python - <<'PY'
          import requests, sys
          targets = {
              "新浪财经": "https://finance.sina.com.cn",
              "巨潮资讯": "http://www.cninfo.com.cn",
              "上海金属网": "https://www.metal.com",
              "TradingView WS": "https://data.tradingview.com",
              "X/Twitter": "https://x.com",
          }
          ok = 0
          for name, url in targets.items():
              try:
                  r = requests.get(url, timeout=15)
                  print(f"OK   {name}: {r.status_code}")
                  ok += 1
              except Exception as e:
                  print(f"FAIL {name}: {type(e).__name__}: {e}")
          print(f"reachable {ok}/{len(targets)}")
          PY
