# __DB_CLEAN__ patched
name: 06-移仓换月宽表维护(周日)
on:
  schedule:
    - cron: '30 19 * * 6'   # 北京时间 周日 03:30（UTC 周六 19:30）
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Shanghai
          PG_TABLE: public.移仓换月宽表
        run: |
          python "移仓换月宽表/src/02_add_auto_columns.py"
